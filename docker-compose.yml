# Used by Coolify on the manna host (Docker Compose build pack).
# Coolify fills SERVICE_PASSWORD_* automatically and shows them in its UI.
# The app port is bound to 127.0.0.1 only; host nginx terminates TLS for
# manna.biobank.tw and proxies to it.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://manna:${SERVICE_PASSWORD_POSTGRES}@db:5432/manna
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_BOOTSTRAP_CODE: ${SERVICE_PASSWORD_ADMINCODE}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: manna
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: manna
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manna -d manna"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
