# Used by Coolify on the manna host (Docker Compose build pack).
#
# The database is NOT part of this compose file: it is a standalone Coolify
# PostgreSQL resource (image pgvector/pgvector:pg17, "manna-dls-db") in the same
# project and environment, private to Coolify's internal network, with Coolify's
# scheduled backups. Set DATABASE_URL in this application's environment variables
# to that resource's "Postgres URL (internal)", and keep "Connect to predefined
# network" enabled (Advanced) so the app can reach it.
#
# The app port is bound to 127.0.0.1 only; host nginx terminates TLS for
# manna.biobank.tw and proxies to it.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # NCHC (國網中心) GenAI — the approved provider for the formal platform.
      # Set AI_PROVIDER=openai_compatible and these in Coolify (never in this file).
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      AI_TIMEOUT_SECS: ${AI_TIMEOUT_SECS:-150}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_BOOTSTRAP_CODE: ${SERVICE_PASSWORD_ADMINCODE}
      RUST_LOG: ${RUST_LOG:-info}
      # Material files (docs/API.md「Phase 2.2」, docs/BLUEPRINT.md §13.3). s3 = the Coolify
      # MinIO service in the same project (internal network only, private bucket without
      # versioning). Until it exists this stays "none": uploads are refused with a clear message,
      # pasted text and links still work. Keys are set in Coolify, never in this file.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-none}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Set by Coolify for each deployment; reported by /api/health.
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8080:8080"
