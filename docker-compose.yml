# Used by Coolify on the manna host (Docker Compose build pack).
#
# The database is NOT part of this compose file: it is a standalone Coolify
# PostgreSQL resource (image pgvector/pgvector:pg17, "manna-dls-db") in the same
# project and environment, private to Coolify's internal network, with Coolify's
# scheduled backups. Set DATABASE_URL in this application's environment variables
# to that resource's "Postgres URL (internal)", and keep "Connect to predefined
# network" enabled (Advanced) so the app can reach it.
#
# MinIO (material files) runs beside the app in this file; see the `minio` service.
#
# The app port is bound to 127.0.0.1 only; host nginx terminates TLS for
# manna.biobank.tw and proxies to it.
services:
  app:
    build:
      context: .
      args:
        # Baked into the image as BUILD_COMMIT and reported by /api/health. Coolify sets
        # SOURCE_COMMIT for the build only with "Include Source Commit in Build" on (README「部署」).
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # NCHC (國網中心) GenAI — the approved provider for the formal platform.
      # Set AI_PROVIDER=openai_compatible and these in Coolify (never in this file).
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      AI_TIMEOUT_SECS: ${AI_TIMEOUT_SECS:-150}
      # Semantic index for hybrid retrieval (docs/API.md「Phase 2.4」). Off by default; set
      # EMBEDDING_PROVIDER=openai_compatible and the rest in Coolify. The NCHC embeddings key is
      # separate from the chat key. Any failure falls back to keyword retrieval.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma-2}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      EMBEDDING_QUERY_TIMEOUT_MS: ${EMBEDDING_QUERY_TIMEOUT_MS:-2500}
      DEMO_MODE: ${DEMO_MODE:-true}
      ADMIN_BOOTSTRAP_CODE: ${SERVICE_PASSWORD_ADMINCODE}
      RUST_LOG: ${RUST_LOG:-info}
      # Material files (docs/API.md「Phase 2.2」, docs/BLUEPRINT.md §13.3) go to the `minio`
      # service below. Its credentials are Coolify magic variables: generated once by Coolify,
      # shared by both services, never written in this file or typed by hand. The app creates
      # the bucket (no versioning, so hard delete is real) on first start.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-manna-materials}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${SERVICE_USER_MINIO}
      S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
      # Fallback for /api/health when the image has no commit baked in (see `build.args`).
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    depends_on:
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  # Teaching-material files. Internal network only: no ports, not exposed through nginx; the
  # app streams files to signed-in users. The volume is NOT covered by Coolify's database
  # backups (see docs/BLUEPRINT.md §10).
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
