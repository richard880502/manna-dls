[package]
name = "manna-api"
version = "0.1.0"
edition = "2021"
description = "Manna DLS backend: AI-assisted lesson preparation for high-school English teachers"
publish = false

[lib]
name = "manna_api"
path = "src/lib.rs"

[[bin]]
name = "manna-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
krilla = { version = "0.8", default-features = false, features = ["simple-text", "raster-images"] }
hmac = "0.12"
# Scanned-page photos for OCR: decode, orient, downscale (no rayon, only the upload formats).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pdf-extract = "0.12"
quick-xml = "0.42"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusty-s3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "migrate",
    "chrono",
    "json",
    "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ttf-parser = "0.25"
# Kangxi radicals in PDF text layers back to ideographs (materials::exam).
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
