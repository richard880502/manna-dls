# Independent Coolify resource: base directory /memory-sidecar, Compose location /docker-compose.yml.
# Connect only this resource and Manna API to the pre-created external network.
services:
  memory:
    build: .
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GRAPHITI_TOKEN: ${GRAPHITI_TOKEN:?Set a random service secret}
      MEMORY_PROXY_URL: ${MEMORY_PROXY_URL:-http://manna-api:8080/api/internal/memory/v1}
      FALKORDB_HOST: falkordb
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "2"
    networks:
      memory-private: {}
      memory-link:
        aliases: [manna-memory]
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://localhost:8000/health',headers={'Authorization':'Bearer '+os.environ['GRAPHITI_TOKEN']}); urllib.request.urlopen(r,timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5

  falkordb:
    image: falkordb/falkordb:v4.12.0@sha256:7927eb194df0fadf70e2deb6c20c8178743ec92aacd739c790f8a35ce5dee613
    restart: unless-stopped
    mem_limit: 512m
    environment:
      FALKORDB_ARGS: "THREAD_COUNT 2"
    volumes:
      - memory-graph:/data
    networks:
      - memory-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  memory-link:
    external: true
    name: ${MEMORY_NETWORK_NAME:-manna-memory}
  memory-private:
    internal: true

volumes:
  memory-graph:
