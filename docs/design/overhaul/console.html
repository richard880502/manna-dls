<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>上課中 · Manna 設計稿</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<header class="top">
  <a class="brand" href="home.html"><span class="star" aria-hidden="true"></span>Manna</a>
  <span class="small muted">上課中 · 已同步</span>
  <a class="acct" href="class.html">結束本節課</a>
</header>
<main class="console">
  <div class="console-top">
    <div><p class="small muted">高一 3 班 · L3 The Umbrella Stand</p><h1>第 2 節　精讀與提問</h1></div>
    <p class="clock" aria-label="已上課 18 分 42 秒">18:42</p>
  </div>
  <p class="now-step"><span>現在：<b>C. 第 3 段 比較表</b>　<span class="muted small">預計 8 分鐘</span></span><span class="small"><a href="#">上一段</a>　<a href="#">下一段</a></span></p>

  <div class="marks">
    <button class="mark good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>順利<small>這裡進行得不錯</small></button>
    <button class="mark stuck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>卡住<small>這裡學生有困難</small></button>
  </div>

  <section class="log" aria-labelledby="log-h">
    <div class="head-row"><h2 id="log-h" style="font-size:18px">這節課記了 3 次</h2><span class="small"><a href="#">用手機當遙控器</a></span></div>
    <ol>
      <li><time>16:05</time><span class="tag warn">卡住</span><span>C. 第 3 段 比較表</span></li>
      <li><time>09:30</time><span class="tag ok">順利</span><span>B. 第 1–2 段 找原因</span></li>
      <li><time>03:12</time><span class="tag ok">順利</span><span>A. 暖身</span></li>
    </ol>
    <p class="small muted" style="margin-top:12px">現在按一下就好，細節下課後再補寫。上課中不會呼叫 AI。</p>
  </section>
</main>
</body>
</html>
