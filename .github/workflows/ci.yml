name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: a cancelled run would skip its deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Saving Actions minutes (private repo, 2,000 free minutes/month per account):
#   * jobs run only when their part of the repo changed (docs-only changes run nothing);
#   * the Docker image is built on pull requests only. After merge, main runs the
#     tests again and deploys; Coolify builds the image itself and the deploy job
#     fails if that build or the live health check fails.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists PR files through the API
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      ci: ${{ steps.filter.outputs.ci }}
      memory: ${{ steps.filter.outputs.memory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On main, compare against the `deploy` branch (what is live), not just
          # the last push: app changes from earlier merges still get deployed even
          # when the latest merge is docs-only or an earlier run was cancelled.
          base: ${{ github.event_name == 'push' && 'deploy' || '' }}
          filters: |
            web:
              - 'web/**'
            api:
              - 'api/**'
            app:
              - 'web/**'
              - 'api/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
            memory:
              - 'memory-sidecar/**'
            ci:
              - '.github/workflows/**'

  web:
    name: Web (lint, typecheck, test, build)
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    name: API (fmt, clippy, test)
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: manna
          POSTGRES_PASSWORD: manna
          POSTGRES_DB: manna
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manna -d manna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://manna:manna@localhost:5432/manna
      AI_PROVIDER: fake
      CARGO_TERM_COLOR: always
      # Each integration test is its own binary; with full debug info they no longer fit on the
      # runner's disk (the linker died with SIGBUS). Line tables are enough for test backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
      WORKSHEET_CJK_FONT: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
    defaults:
      run:
        working-directory: api
    steps:
      # The runner ships large toolchains this job never uses; free their space for target/.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      # pdftoppm/pdfinfo: the OCR tests render PDF pages (api/tests/ocr.rs fails without them in CI).
      # fonts-wqy-microhei: the same Chinese font the Docker image ships, so PDFs with Chinese
      # (teacher notes, word-list hints) export in tests as they do in production.
      - name: Install poppler-utils and the Chinese font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils fonts-wqy-microhei
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  memory:
    name: Graphiti adapter (contract and real database)
    needs: [changes]
    if: needs.changes.outputs.memory == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.12.0@sha256:7927eb194df0fadf70e2deb6c20c8178743ec92aacd739c790f8a35ce5dee613
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: memory-sidecar/requirements.txt
      - run: pip install -r memory-sidecar/requirements.txt
      - run: python -m unittest discover -s memory-sidecar -v
        env:
          MEMORY_SMOKE: 'true'
          FALKORDB_HOST: 127.0.0.1
      - run: docker build -t manna-memory-test memory-sidecar

  docker:
    name: Docker image builds
    needs: [changes, web, api, memory]
    # PRs only; skipped/absent web or api results are fine, failures are not.
    if: >-
      always() && github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment flow (development happens through PRs; see README):
  #   1. A fully green run on main fast-forwards the `deploy` branch (GITHUB_TOKEN).
  #   2. Coolify watches `deploy` and deploys it (auto deploy via its GitHub App).
  #   3. This job waits for that Coolify deployment and records it as a GitHub
  #      Deployment + "Coolify" check created by the coolify-deployments-richard App,
  #      the same way as neverland-erp and llm-label.
  # Without the secrets, steps 1-2 still happen; only waiting/recording is skipped.
  #   secret   COOLIFY_API_TOKEN       Coolify API token (read permission is enough)
  #   secret   DEPLOY_APP_PRIVATE_KEY  private key of the deployments GitHub App
  #   variable COOLIFY_URL, COOLIFY_APP_UUIDS, DEPLOY_APP_ID, DEPLOY_ENV_NAME, DEPLOY_ENV_URL
  deploy:
    name: Deploy (Coolify)
    needs: [changes, web, api, memory]
    # Only when the app changed (docs/CI-only merges do not redeploy), and only
    # if the tests that ran passed.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.app == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SHA: ${{ github.sha }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      APP_UUIDS: ${{ vars.COOLIFY_APP_UUIDS }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      ENV_NAME: ${{ vars.DEPLOY_ENV_NAME || 'production' }}
      ENV_URL: ${{ vars.DEPLOY_ENV_URL }}
      # the secrets context cannot be used in step conditions
      HAS_APP_KEY: ${{ secrets.DEPLOY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Create GitHub App token
        id: app
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-deployments: write
          permission-checks: write

      - name: Create the Coolify check and GitHub Deployment (in progress)
        id: dep
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          check_id=$(jq -n --arg sha "$SHA" --arg url "$run_url" \
            '{name:"Coolify", head_sha:$sha, status:"in_progress", details_url:$url, output:{title:"Deployment in progress", summary:"Waiting for Coolify deployment results."}}' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --jq .id)
          echo "check_id=$check_id" >> "$GITHUB_OUTPUT"
          dep_id=$(jq -n --arg ref "$SHA" --arg env "$ENV_NAME" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], production_environment:true, transient_environment:false, description:"Coolify deployment"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "dep_id=$dep_id" >> "$GITHUB_OUTPUT"
          jq -n --arg log "$run_url" '{state:"in_progress", log_url:$log, description:"Waiting for Coolify"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$dep_id/statuses" --input - --silent
          echo "GitHub deployment $dep_id created"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward the deploy branch to this commit
        run: git push origin "${SHA}:refs/heads/deploy"

      - name: Wait for the Coolify deployment of this commit
        id: wait
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_URL:-}" ] || [ -z "${APP_UUIDS:-}" ]; then
            echo "::warning::COOLIFY_API_TOKEN / COOLIFY_URL / COOLIFY_APP_UUIDS not set: deploy branch was updated, but the Coolify result is not tracked."
            exit 0
          fi
          api() {
            curl -sS --retry 3 --retry-delay 5 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' \
              "$COOLIFY_URL/api/v1/$1"
          }
          fail=0
          last_log=""
          for u in $APP_UUIDS; do
            name=$(api "applications/$u" | jq -r '.name // "app"')
            echo "::group::$name ($u)"
            # 1) find the deployment Coolify started for this commit (up to ~6 minutes)
            dep=""
            for i in $(seq 1 24); do
              dep=$(api "deployments/applications/$u?skip=0&take=15" \
                | jq -r --arg sha "$SHA" '[.deployments[] | select(.commit == $sha)] | sort_by(.created_at) | last | .deployment_uuid // empty')
              [ -n "$dep" ] && break
              sleep 15
            done
            if [ -z "$dep" ]; then
              echo "::error::Coolify did not start a deployment of $SHA for $name within 6 minutes. Check that it watches the deploy branch with auto deploy on."
              echo "- $name: **no deployment started** for \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              echo "::endgroup::"
              continue
            fi
            echo "Deployment: $dep"
            # 2) wait until it finishes (up to ~35 minutes; Rust builds on manna are slow)
            status=""
            for i in $(seq 1 140); do
              status=$(api "deployments/$dep" | jq -r '.status // "unknown"')
              case "$status" in finished|failed|cancelled-by-user|cancelled) break ;; esac
              sleep 15
            done
            echo "Final status: $status"
            path=$(api "deployments/$dep" | jq -r '.deployment_url // empty')
            [ -n "$path" ] && last_log="${COOLIFY_URL}${path}" && echo "Coolify log: $last_log"
            echo "- $name: **$status** (deployment \`$dep\`, commit \`${SHA:0:7}\`)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "finished" ]; then
              echo "::error::$name deployment ended as '$status'"
              fail=1
            fi
            echo "::endgroup::"
          done
          echo "log_url=$last_log" >> "$GITHUB_OUTPUT"
          exit $fail

      # Coolify reports "finished" once the containers are started, even if the
      # app then crash-loops (e.g. a missing DATABASE_URL). Only a healthy
      # /api/health on the public URL counts as a successful deployment.
      - name: Check the live site is healthy
        if: env.ENV_URL != ''
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            body=$(curl -fsS -m 10 "$ENV_URL/api/health" || true)
            echo "attempt $i: ${body:-no response}"
            if [ "$(jq -r '.ok // false' <<<"${body:-{}}" 2>/dev/null)" = "true" ]; then
              echo "Live site is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$ENV_URL/api/health did not report ok within 4 minutes after the Coolify deployment finished. Check the app container logs in Coolify (for example an empty DATABASE_URL)."
          exit 1

      - name: Create GitHub App token (for the final status)
        id: app2
        if: ${{ always() && steps.dep.outputs.check_id != '' }}
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-deployments: write
          permission-checks: write

      - name: Report the result to GitHub
        if: ${{ always() && steps.dep.outputs.check_id != '' }}
        env:
          GH_TOKEN: ${{ steps.app2.outputs.token }}
          DEP_ID: ${{ steps.dep.outputs.dep_id }}
          CHECK_ID: ${{ steps.dep.outputs.check_id }}
          RESULT: ${{ job.status }}
          COOLIFY_LOG: ${{ steps.wait.outputs.log_url }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success)   state=success; conclusion=success; desc="Deployed successfully" ;;
            cancelled) state=inactive; conclusion=cancelled; desc="Cancelled" ;;
            *)         state=failure; conclusion=failure; desc="Coolify deployment failed" ;;
          esac
          log="${COOLIFY_LOG:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          jq -n --arg result "$conclusion" --arg title "$desc" --arg log "$log" \
            '{status:"completed", conclusion:$result, details_url:$log, output:{title:$title, summary:("[View deployment logs](" + $log + ")")}}' \
            | gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" --method PATCH --input - --silent
          jq -n --arg s "$state" --arg d "$desc" --arg log "$log" --arg url "$ENV_URL" \
            '{state:$s, description:$d, log_url:$log, auto_inactive:true} + (if $url != "" and $s == "success" then {environment_url:$url} else {} end)' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$DEP_ID/statuses" --input - --silent
          echo "GitHub deployment $DEP_ID -> $state"
